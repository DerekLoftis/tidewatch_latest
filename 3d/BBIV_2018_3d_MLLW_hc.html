            var details = "Stand-in until Tidewatch publishes BBIV: NWPS gauge BBIV2 (City of Virginia Beach) observations; harmonic tide referenced to m30; surge from P-ETSS at Little Neck Creek at Pinewood Rd in Virginia Beach", shown = false;
            chart.title.on('click', function () {
                shown = !shown;
                chart.setTitle(null, {text: shown ? details : ''});
            });
            chart.title.element.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = 'Click for data sources';
    });
        </script>
