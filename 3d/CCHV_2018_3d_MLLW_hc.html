                                    if (px >= x0 && px <= x1 && py >= y0 && py <= y1) hits++;
                                });
                            });
                            if (hits < bestHits) { best = c; bestHits = hits; }
                        });
                        logoEl = chart.renderer.image(cfg.logo, best[0], best[1], w, h)
                            .attr({opacity: 0.5, zIndex: 0}).add();
                    };
                    placeLogo();
                    Highcharts.addEvent(chart, 'redraw', placeLogo);
                }
            })();

            // sources and datum notes stay hidden so the chart keeps its height in an iframe;
            // clicking the title shows or hides them as the subtitle
            var details = "Stand-in until Tidewatch publishes CCHV: NWPS gauge CCHV2 (The University of Virginia) observations; harmonic tide referenced to m30; surge from P-ETSS at Atlantic Coast at Wachapreague", shown = false;
            chart.title.on('click', function () {
                shown = !shown;
                chart.setTitle(null, {text: shown ? details : ''});
            });
            chart.title.element.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = 'Click for data sources';
    });
        </script>
    </body>
</html>
