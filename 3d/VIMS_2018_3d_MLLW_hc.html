            var details = "Stand-in until Tidewatch publishes VIMS: NWPS gauge YKTV2 (NOAA CO-OPS Yorktown USCG 8637689, across the York River) observations; harmonic tide referenced to m30; surge from P-ETSS at Chesapeake Bay near Yorktown", shown = false;
            chart.title.on('click', function () {
                shown = !shown;
                chart.setTitle(null, {text: shown ? details : ''});
            });
            chart.title.element.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = 'Click for data sources';
    });
        </script>
