            var details = "Stand-in until Tidewatch publishes EZMV: NWPS gauge EZMV2 (USGS) observations; harmonic tide referenced to m30; surge from P-ETSS at Elizabeth River at the Midtown Tunnel", shown = false;
            chart.title.on('click', function () {
                shown = !shown;
                chart.setTitle(null, {text: shown ? details : ''});
            });
            chart.title.element.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = 'Click for data sources';
    });
        </script>
    </body>
