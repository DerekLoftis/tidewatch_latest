                        var w = Math.min(170, chart.plotWidth * 0.22), h = w * cfg.logoAspect, pad = 8;
                        var L = chart.plotLeft, T = chart.plotTop, R = L + chart.plotWidth, B = T + chart.plotHeight;
                        var corners = [[R - pad - w, T + pad], [L + pad, T + pad], [R - pad - w, B - pad - h], [L + pad, B - pad - h]];
                        var best = null, bestHits = 1e9;
                        corners.forEach(function (c) {
                            if (best && bestHits === 0) return;
                            var hits = 0, x0 = c[0] - 4, x1 = c[0] + w + 4, y0 = c[1] - 4, y1 = c[1] + h + 4;
                            chart.series.forEach(function (s) {
                                if (!s.visible) return;
                                s.points.forEach(function (pt) {
                                    if (pt.y === null || pt.plotX === undefined) return;
                                    var px = L + pt.plotX, py = T + pt.plotY;
                                    if (px >= x0 && px <= x1 && py >= y0 && py <= y1) hits++;
                                });
                            });
                            if (hits < bestHits) { best = c; bestHits = hits; }
                        });
                        logoEl = chart.renderer.image(cfg.logo, best[0], best[1], w, h)
                            .attr({opacity: 0.5, zIndex: 0}).add();
                    };
                    placeLogo();
                    Highcharts.addEvent(chart, 'redraw', placeLogo);
                }
            })();

            // sources and datum notes stay hidden so the chart keeps its height in an iframe;
            // clicking the title shows or hides them as the subtitle
            var details = "Stand-in until Tidewatch publishes DPCV: NWPS gauge DPCV2 (USACE) observations; harmonic tide referenced to m30; surge from P-ETSS at Elizabeth River near Money Point; MLLW = gauge stage -0.90 ft", shown = false;
            chart.title.on('click', function () {
                shown = !shown;
                chart.setTitle(null, {text: shown ? details : ''});
            });
            chart.title.element.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = 'Click for data sources';
    });
        </script>
    </body>
</html>
