# Every 6 hours (20 minutes after the archive runs), copy the latest Tidewatch
# charts and CSVs to fixed paths and deploy them to GitHub Pages.
name: Publish latest Tidewatch

on:
  schedule:
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r styler/requirements.txt
      - name: Fetch the latest Tidewatch files
        run: python publish.py site raw
      # Datum lines, m30, disclaimer and logo (the capture thread's styler).
      # A page that can't be styled keeps Tidewatch's original.
      - name: Style the chart pages
        continue-on-error: true
        run: |
          cd styler
          for p in f36 3d 30d; do
            [ -d ../site/$p ] || continue
            python style_pages.py --product $p --pages ../site/$p --csv ../site/$p \
              --pickles ../raw/f36 --out ../styled/$p --jsdir=../jslib || continue
            cp ../styled/$p/*.html ../site/$p/
          done
          mkdir -p ../site/jslib && cp jslib/* vims_logo.png ../site/jslib/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
