# Deploys the published Tidewatch latest site to GitHub Pages. The site is built in the private
# DerekLoftis/tidewatch_archive (its tidewatch_site.yml, every 6 hours), pushed to this repository's
# `site` branch, and announced with a `publish` repository_dispatch, which runs this workflow. It can
# also be run by hand to redeploy the newest `site` branch.
name: Deploy site

on:
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site
      - run: rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
