            (function () {
                var cfg = {"lines": [{"name": "HAT (est.)", "value": 2.27, "key": "HAT"}, {"name": "MHHW", "value": 1.72, "key": "MHHW"}, {"name": "MSL", "value": 0.82, "key": "MSL"}, {"name": "MLLW", "value": 0.0, "key": "MLLW"}, {"name": "LAT (est.)", "value": -0.46, "key": "LAT"}, {"name": "NAVD88", "value": 1.43}, {"name": "m30", "value": 2.04}], "hat": 2.27, "hatName": "HAT", "style": {"HAT": ["Dash", 1, "#8a8a8a"], "MHHW": ["ShortDash", 1, "#8a8a8a"], "MSL": ["LongDash", 1, "#8a8a8a"], "LAT": ["Dash", 1, "#8a8a8a"], "MLLW": ["Solid", 1, "#8a8a8a"], "NAVD88": ["Solid", 1, "#8a8a8a"], "m30": ["DashDot", 1.5, "#16687E"], "HAT+": ["Dot", 1, "#b0b0b0"], "Action": ["Solid", 2, "#FFFF00"], "Minor": ["Solid", 2, "#FF9900"], "Moderate": ["Solid", 2, "#FF0000"], "Major": ["Solid", 2, "#CC33FF"]}, "datum": "MLLW", "disclaimer": "Disclaimer: Tidewatch Charts\u2122 are automated storm tide forecasts; User assumes all risk", "logo": "../jslib/vims_logo.png", "logoAspect": 0.25416666666666665, "note": null};
                var dmax = -1e9, dmin = 1e9;

                var hiLine = cfg.lines.reduce(function (a, l) { return Math.max(a, l.value); }, -1e9);
                var top = cfg.hat === null ? 0 : Math.max(2, Math.ceil(dmax - cfg.hat));
                var pl = [];

                            if (!p.label.twToggle) {

                if (cfg.note) {  // data caveat as a subtitle
                    chart.setTitle(null, {text: cfg.note, style: {color: '#a05a00', fontSize: '11px'}});

                if (cfg.logo) {
